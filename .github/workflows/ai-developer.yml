name: AI Developer

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Child Issue number to implement
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture implementation Issue as data
        run: gh issue view "$ISSUE_NUMBER" --json number,title,body,labels,url > issue.json
      - name: Implement and test
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/developer.md
          output-file: developer-summary.md
          sandbox: workspace-write
      - name: Open draft pull request
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: feature/issue-${{ inputs.issue_number }}-implementation
          delete-branch: true
          draft: true
          title: 'feat: implement #${{ inputs.issue_number }}'
          commit-message: 'feat: implement #${{ inputs.issue_number }}'
          body: |
            Closes #${{ inputs.issue_number }}

            Generated by the OpenAgent Developer workflow. Review the linked
            Issue, the diff, test evidence, and all CI results before merging.
      - name: Report pull request to the Issue
        if: steps.create_pr.outputs.pull-request-number != ''
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Developer created draft PR #${{ steps.create_pr.outputs.pull-request-number }}."
