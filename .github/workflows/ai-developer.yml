name: AI Developer

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Child Issue number to implement
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    if: github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture implementation Issue as data
        run: gh issue view "$ISSUE_NUMBER" --json number,title,body,labels,url > issue.json
      - name: Configure New API provider
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          cp .github/codex/newapi-config.toml "$CODEX_HOME/config.toml"
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.144.6
      - name: Implement and test
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          NEWAPI_API_KEY: ${{ secrets.NEWAPI_API_KEY }}
        run: |
          codex exec --skip-git-repo-check --sandbox danger-full-access \
            --output-last-message developer-summary.md \
            "$(cat .github/codex/prompts/developer.md)"
      - name: Open pull request
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: feature/issue-${{ inputs.issue_number }}-implementation
          delete-branch: true
          draft: false
          title: 'feat: implement #${{ inputs.issue_number }}'
          commit-message: 'feat: implement #${{ inputs.issue_number }}'
          body: |
            Closes #${{ inputs.issue_number }}

            Generated by the OpenAgent Developer workflow. Review the linked
            Issue, the diff, test evidence, and all CI results before merging.
      - name: Report pull request to the Issue
        if: steps.create_pr.outputs.pull-request-number != ''
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Developer created PR #${{ steps.create_pr.outputs.pull-request-number }}."