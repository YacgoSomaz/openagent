name: AI Merge Gate

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to merge
        required: true
        type: string
      confirm_merge:
        description: Confirm that this merge is intended
        required: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.actor == github.repository_owner && inputs.confirm_merge
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@v5
      - name: Require successful GitHub checks
        run: gh pr checks "$PR_NUMBER" --watch=false
      - name: Squash merge and delete feature branch
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
      - name: Close linked Issues
        run: |
          gh pr view "$PR_NUMBER" --json closingIssuesReferences --jq '.closingIssuesReferences[].number' |
            xargs -r -n1 gh issue close