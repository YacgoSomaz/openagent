name: Feature request
description: Propose a feature for the OpenAgent workflow
title: '[Feature]: '
labels: ['ai:ready']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended outcome
      description: Describe the user-facing value and expected result.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that prove the feature is complete.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and non-goals
      description: Include compatibility, security, architectural, or timing limits.
